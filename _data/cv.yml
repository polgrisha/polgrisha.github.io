    Publications:
      - title: "Understanding Wacky Weights: A Dissection of SPLADE's Learned Term Importance"
        authors:
          - G. Polyakov
          - H. Scells
          - C. Eickhoff
        date: 2026
        journal: SIGIR 2026
        url: https://arxiv.org/abs/2605.19628
        summary: "Introduced metrics to formally quantify wacky weights (semantically unrelated expansion terms) in SPLADE sparse retrieval models. Showed that wacky weights mainly drive in-domain effectiveness, and measured which SPLADE settings promote more wacky weights."

      - title: Interpretability Analysis of Arithmetic In-Context Learning in Large Language Models
        authors:
          - G. Polyakov
          - C. Hepting
          - C. Eickhoff
          - A. Bahrainian
        date: 2025
        journal: EMNLP 2025
        url: https://aclanthology.org/2025.emnlp-main.92/
        summary: "Identified the internal mechanisms LLMs use for in-context learning on arithmetic tasks. Used these findings to design a steering method that improves zero-shot performance, reducing the need for few-shot examples."

      - title: Towards Best Practices of Axiomatic Activation Patching in Information Retrieval
        authors:
          - G. Polyakov
          - C. Chen
          - C. Eickhoff
        date: 2025
        journal: SIGIR 2025
        url: https://dl.acm.org/doi/10.1145/3726302.3730256
        summary: "Proposed a noise-mitigating evaluation metric for activation patching in neural rankers that filters out spurious low-confidence signals. Systematically analyzed diagnostic datasets, identifying key selection criteria for queries and documents to ensure robust interpretability analysis."

      - title: "ToolReflection: Improving Large Language Models for Real-World API Calls with Self-Generated Data"
        authors:
          - G. Polyakov
          - I. Alimova
          - D. Abulkhanov
          - I. Sedykh
          - A. Bout
          - S. Nikolenko
          - I. Piontkovskaya
        date: 2025
        journal: ACL 2025 REALM Workshop
        url: https://aclanthology.org/2025.realm-1.14/
        summary: "Proposed a fine-tuning strategy that enables LLMs to self-correct API calls by learning from runtime execution feedback. Co-developed evaluation datasets designed to assess tool-augmented LLMs in more realistic scenarios."

      - title: Sinkhorn Transformations for Single-Query Postprocessing in Text-Video Retrieval
        authors:
          - K. Yakovlev
          - G. Polyakov
          - I. Alimova
          - A. V. Podolskiy
          - A. Bout
          - S. I. Nikolenko
          - I. Piontkovskaya
        date: 2023
        journal: SIGIR 2023
        url: https://arxiv.org/abs/2311.08143
        summary: "Co-developed a post-processing method based on Sinkhorn transformations that improves video retrieval quality. Introduced a realistic evaluation setting to compare post-processing methods in scenarios closer to real-world applications."

