    Publications:
      - title: "Understanding Wacky Weights: A Dissection of SPLADE's Learned Term Importance"
        authors:
          - G. Polyakov
          - H. Scells
          - C. Eickhoff
        date: 2026
        journal: SIGIR 2026 (Reproducibility)
        url: https://arxiv.org/abs/2605.19628
        summary: "Introduced the Wackiness Score and W-AUC to quantify semantically unrelated expansion terms across models with different vocabularies and sparsity levels. Trained 6 SPLADE variants, showing that the prevalence of wacky tokens increases with vocabulary size and that they mainly aid in-domain retrieval."

      - title: Interpretability Analysis of Arithmetic In-Context Learning in Large Language Models
        authors:
          - G. Polyakov
          - C. Hepting
          - C. Eickhoff
          - A. Bahrainian
        date: 2025
        journal: EMNLP 2025 (Main)
        url: https://aclanthology.org/2025.emnlp-main.92/
        summary: "Traced how 4 LLMs (up to 12B) use in-context examples for multi-step arithmetic, showing that format consistency matters more than arithmetic correctness. Distilled in-context examples into a function vector that raises zero-shot accuracy by up to 25 points and fully recovers one-shot accuracy on Pythia-12B."

      - title: Towards Best Practices of Axiomatic Activation Patching in Information Retrieval
        authors:
          - G. Polyakov
          - C. Chen
          - C. Eickhoff
        date: 2025
        journal: SIGIR 2025 (Short)
        url: https://dl.acm.org/doi/10.1145/3726302.3730256
        summary: "Proposed a noise-mitigating evaluation metric for activation patching in neural rankers that filters out spurious low-confidence signals. Systematically analyzed diagnostic datasets, identifying key selection criteria for queries and documents to ensure robust interpretability analysis."

      - title: "ToolReflection: Improving Large Language Models for Real-World API Calls with Self-Generated Data"
        authors:
          - G. Polyakov
          - I. Alimova
          - D. Abulkhanov
          - I. Sedykh
          - A. Bout
          - S. Nikolenko
          - I. Piontkovskaya
        date: 2025
        journal: ACL 2025 (REALM Workshop)
        url: https://aclanthology.org/2025.realm-1.14/
        summary: "Proposed a fine-tuning strategy that enables LLMs to self-correct API calls by learning from runtime execution feedback. Co-developed evaluation datasets for tool-augmented LLMs in realistic scenarios."

      - title: Sinkhorn Transformations for Single-Query Postprocessing in Text-Video Retrieval
        authors:
          - K. Yakovlev
          - G. Polyakov
          - I. Alimova
          - A. V. Podolskiy
          - A. Bout
          - S. I. Nikolenko
          - I. Piontkovskaya
        date: 2023
        journal: SIGIR 2023 (Short)
        url: https://arxiv.org/abs/2311.08143

